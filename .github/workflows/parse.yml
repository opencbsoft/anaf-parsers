name: Parse ANAF data

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      parsers:
        description: "Parsers to run (comma-separated: iban,calendar,clasificatii)"
        required: false
        default: "iban,calendar,clasificatii"

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine parsers to run
        id: parsers
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ github.event.inputs.parsers }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=iban,calendar,clasificatii" >> "$GITHUB_OUTPUT"
          fi

      - name: Run parsers
        run: |
          IFS=',' read -ra PARSERS <<< "${{ steps.parsers.outputs.list }}"
          for parser in "${PARSERS[@]}"; do
            parser=$(echo "$parser" | xargs)
            echo "::group::Running $parser parser"
            python main.py "$parser" || echo "::warning::Parser $parser failed"
            echo "::endgroup::"
          done

      - name: Checkout data branch (preserving output)
        run: |
          # Save new output aside
          mv output /tmp/new_output 2>/dev/null || true

          # Switch to data branch (has previous data)
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          # Restore new output
          mv /tmp/new_output /tmp/output 2>/dev/null || true

      - name: Merge new data (keep old if parser failed)
        run: |
          # For each parser directory that produced new output,
          # replace the old data. If a parser produced nothing,
          # the previous data stays untouched.
          if [ -d /tmp/output ]; then
            for parser_dir in /tmp/output/*/; do
              parser_name=$(basename "$parser_dir")
              file_count=$(find "$parser_dir" -name '*.zip' | wc -l)
              if [ "$file_count" -gt 0 ]; then
                echo "Updating $parser_name ($file_count files)"
                rm -rf "./$parser_name"
                cp -r "$parser_dir" "./$parser_name"
              else
                echo "Keeping old data for $parser_name (no new output)"
              fi
            done
          fi

          # Rebuild index from whatever is on the branch now
          echo "# ANAF Parsed Data" > README.md
          echo "" >> README.md
          echo "Auto-generated on $(date -u '+%Y-%m-%d %H:%M UTC')" >> README.md
          echo "" >> README.md
          echo "## Files" >> README.md
          find . -name '*.zip' -not -path './.git/*' | sort | while read f; do
            size=$(du -h "$f" | cut -f1 | xargs)
            echo "- [\`${f#./}\`](${f#./}) ($size)" >> README.md
          done

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update parsed data $(date -u '+%Y-%m-%d')"
            git push origin data
          fi
